[build-system]
requires = ["hatchling>=1.27"]  # >=1.27 for PEP 639 SPDX license fields
build-backend = "hatchling.build"

[project]
name = "llm-bench"
version = "0.1.0"
description = "LLM inference benchmarking harness: serving-engine throughput and latency vs. answer quality across quantization and batching configs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Morley" }]
dependencies = [
  "httpx>=0.27",       # async client driving OpenAI-compatible endpoints
  "matplotlib>=3.8",   # plots are generated from results data, never hand-made
  "numpy>=1.26",       # percentile/statistics math
  "starlette>=0.37",   # local OpenAI-compatible stub server
  "uvicorn>=0.30",     # ASGI runner for the stub
]

[project.scripts]
llm-bench = "llmbench.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "mypy>=1.14",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
# Required because the distribution name (llm-bench) differs from the import
# package name (llmbench), so hatchling cannot infer the package directory.
packages = ["src/llmbench"]

[tool.ruff]
line-length = 100
# Personal practice scratchpad living inside the repo checkout; not project
# code, so lint/format must not police it (it is also gitignored).
extend-exclude = ["python-playground"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade: enforce 3.11+ idioms
  "B",   # bugbear: likely-bug patterns
  "C4",  # comprehensions
  "SIM", # simplify
  "PT",  # pytest style
  "RUF", # ruff-specific
]

[tool.mypy]
strict = true
# 3.12, not the 3.11 support floor: numpy >= 2.5 ships PEP 695 `type` aliases
# in its stubs, which mypy refuses to parse under a 3.11 target. Runtime
# compatibility with 3.11 is enforced by the CI test matrix instead.
python_version = "3.12"
# hatchling's editable installs use a MetaPathFinder import hook that mypy
# cannot traverse, so point mypy at the source tree directly.
mypy_path = ["src"]
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
